<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#c41c00" />
    <meta name="description" content="Dodge oncoming traffic in a Sri Lankan bus. An 8-bit browser game." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LANKAN BUS LEGENDZ" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>LANKAN BUS LEGENDZ</title>
  </head>
  <body>
    <div id="stage">
      <div id="wrap">
        <canvas id="screen" aria-label="LANKAN BUS LEGENDZ"></canvas>
        <button id="btn-mute" class="hit" type="button" aria-label="Mute" aria-pressed="false">Mute</button>
      </div>
      <!-- Driver bubble (bottom left): mirrors the Spotify bubble; the whole bubble is the "Change name" button. -->
      <button id="btn-name" class="bubble ui-bubble" type="button" data-off="true">
        <svg class="bubble-icon" viewBox="0 0 22 21" shape-rendering="crispEdges" aria-hidden="true"><rect x="6" y="0.5" width="2" height="2" fill="#f8b800"/><rect x="8" y="0.5" width="2" height="2" fill="#f8b800"/><rect x="10" y="0.5" width="2" height="2" fill="#f8b800"/><rect x="12" y="0.5" width="2" height="2" fill="#f8b800"/><rect x="14" y="0.5" width="2" height="2" fill="#f8b800"/><rect x="2" y="2.5" width="2" height="2" fill="#f8b800"/><rect x="4" y="2.5" width="2" height="2" fill="#f8b800"/><rect x="16" y="2.5" width="2" height="2" fill="#f8b800"/><rect x="18" y="2.5" width="2" height="2" fill="#f8b800"/><rect x="2" y="4.5" width="2" height="2" fill="#f8b800"/><rect x="18" y="4.5" width="2" height="2" fill="#f8b800"/><rect x="0" y="6.5" width="2" height="2" fill="#f8b800"/><rect x="20" y="6.5" width="2" height="2" fill="#f8b800"/><rect x="0" y="8.5" width="2" height="2" fill="#f8b800"/><rect x="2" y="8.5" width="2" height="2" fill="#f8b800"/><rect x="4" y="8.5" width="2" height="2" fill="#f8b800"/><rect x="6" y="8.5" width="2" height="2" fill="#f8b800"/><rect x="8" y="8.5" width="2" height="2" fill="#f8b800"/><rect x="10" y="8.5" width="2" height="2" fill="#fcfcfc"/><rect x="12" y="8.5" width="2" height="2" fill="#f8b800"/><rect x="14" y="8.5" width="2" height="2" fill="#f8b800"/><rect x="16" y="8.5" width="2" height="2" fill="#f8b800"/><rect x="18" y="8.5" width="2" height="2" fill="#f8b800"/><rect x="20" y="8.5" width="2" height="2" fill="#f8b800"/><rect x="0" y="10.5" width="2" height="2" fill="#f8b800"/><rect x="8" y="10.5" width="2" height="2" fill="#fcfcfc"/><rect x="10" y="10.5" width="2" height="2" fill="#fcfcfc"/><rect x="12" y="10.5" width="2" height="2" fill="#fcfcfc"/><rect x="20" y="10.5" width="2" height="2" fill="#f8b800"/><rect x="0" y="12.5" width="2" height="2" fill="#f8b800"/><rect x="10" y="12.5" width="2" height="2" fill="#fcfcfc"/><rect x="20" y="12.5" width="2" height="2" fill="#f8b800"/><rect x="2" y="14.5" width="2" height="2" fill="#f8b800"/><rect x="10" y="14.5" width="2" height="2" fill="#fcfcfc"/><rect x="18" y="14.5" width="2" height="2" fill="#f8b800"/><rect x="2" y="16.5" width="2" height="2" fill="#f8b800"/><rect x="4" y="16.5" width="2" height="2" fill="#f8b800"/><rect x="10" y="16.5" width="2" height="2" fill="#fcfcfc"/><rect x="16" y="16.5" width="2" height="2" fill="#f8b800"/><rect x="18" y="16.5" width="2" height="2" fill="#f8b800"/><rect x="6" y="18.5" width="2" height="2" fill="#f8b800"/><rect x="8" y="18.5" width="2" height="2" fill="#f8b800"/><rect x="10" y="18.5" width="2" height="2" fill="#f8b800"/><rect x="12" y="18.5" width="2" height="2" fill="#f8b800"/><rect x="14" y="18.5" width="2" height="2" fill="#f8b800"/></svg>
        <span class="bubble-text"><span id="driver-name"></span><span id="change-name">Change name</span></span>
      </button>
      <!-- Music credit: Spotify's official icon (unaltered, 21px+, with its clear space), opens the track. -->
      <a id="music-bubble" class="bubble ui-bubble" target="_blank" rel="noopener noreferrer" data-off="true">
        <img class="bubble-icon" src="./icons/spotify-icon-green.svg" alt="Spotify" />
        <span class="bubble-text" id="music-text"></span>
      </a>
      <button id="btn-up" class="ctrl" type="button" tabindex="-1" aria-label="Move up a lane">
        <svg viewBox="0 0 9 5" aria-hidden="true"><path fill="#f8b800" d="M4 0h1v1h1v1h1v1h1v1h1v1H0V4h1V3h1V2h1V1h1z" /></svg>
      </button>
      <button id="btn-down" class="ctrl" type="button" tabindex="-1" aria-label="Move down a lane">
        <svg viewBox="0 0 9 5" aria-hidden="true"><path fill="#f8b800" d="M0 0h9v1H8v1H7v1H6v1H5v1H4V4H3V3H2V2H1V1H0z" /></svg>
      </button>
      <section id="over" class="panel" hidden aria-label="Game over">
        <div class="over-head">
          <h2>GAME OVER</h2>
          <p class="over-score">SCORE <b id="over-score">0</b></p>
          <p class="over-best"><span id="over-best">BEST: 0</span> <span id="over-newbest" hidden>NEW BEST!</span></p>
        </div>
        <div class="over-board">
          <h3>TOP 10</h3>
          <ol id="board"></ol>
          <p id="board-me" hidden></p>
          <p id="board-status" role="status">LOADING LEADERBOARD…</p>
        </div>
        <div class="over-actions">
          <button id="btn-retry" class="act act-retry" type="button">RETRY</button>
          <a id="btn-share" class="act act-share" target="_blank" rel="noopener">SHARE ON WHATSAPP</a>
        </div>
        <p id="creator-over" class="creator">Created By - <a class="creator-link" href="https://www.linkedin.com/in/malindu-karu/" target="_blank" rel="noopener noreferrer">Malindu K</a></p>
      </section>
      <form id="name-panel" class="panel" hidden novalidate aria-label="Choose your name">
        <h2>WHAT'S YOUR NAME, DRIVER?</h2>
        <p class="name-help">For the leaderboard. 3–12 letters, numbers and spaces.</p>
        <input id="name-input" type="text" maxlength="12" autocomplete="nickname" autocapitalize="words" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-describedby="name-error" />
        <p id="name-error" role="alert"></p>
        <div class="name-actions">
          <button id="name-cancel" class="act act-cancel" type="button" hidden>CANCEL</button>
          <button id="name-ok" class="act act-retry" type="submit">LET'S GO</button>
        </div>
      </form>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <!-- GoatCounter: cookie-free page-view counting (events are sent from src/analytics.ts). Loaded async: never blocks the game. -->
    <script
      data-goatcounter="https://busgamemalindu.goatcounter.com/count"
      async
      src="https://gc.zgo.at/count.v4.js"
      crossorigin="anonymous"
      integrity="sha384-nRw6qfbWyJha9LhsOtSb2YJDyZdKvvCFh0fJYlkquSFjUxp9FVNugbfy8q1jdxI+"
    ></script>
  </body>
</html>
